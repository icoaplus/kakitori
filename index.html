const all=defs.flatMap((d,bi)=>d.parts.map((p,pi)=>({id:bi+'-'+pi,bi,pi,file:p[0],w:p[3]*123,h:p[4]*123})));let active=0,placed={},done=defs.map(()=>false),selected=null,pool='needed',drag=null,suppressClick=false;
const $=s=>document.querySelector(s),stage=$('#stage');function asset(f){return embeddedAssets[f]}
function begin(){pool=$('input[name=pool]:checked').value;active=0;placed={};done=defs.map(()=>false);selected=null;$('#setup').style.display='none';$('#game').style.display='block';$('#back').hidden=false;$('#finish').style.display='none';$('#message').textContent='';render()}
function point(e){let r=stage.getBoundingClientRect();return {x:(e.clientX-r.left)*1400/r.width,y:(e.clientY-r.top)*750/r.height}}
function render(){stage.querySelectorAll('.blank,.piece').forEach(e=>e.remove());defs.forEach((d,i)=>{let b=document.createElement('div');b.className='blank'+(active===i?' active':'')+(done[i]?' done':'');b.dataset.bi=i;b.style.cssText=`left:${d.x/14}%;top:${d.y/7.5}%;width:${123/14}%;height:${123/7.5}%`;b.setAttribute('role','button');b.tabIndex=0;b.setAttribute('aria-label',d.q+'問目の空欄'+(i===5?'、人':''));b.onclick=e=>{if(suppressClick){suppressClick=false;return}if(selected&&!placed[selected.id]){let t=point(e);placeAt(selected,t.x-selected.w/2,t.y-selected.h/2);active=i;selected=null;render()}else{active=i;selected=null;$('#message').textContent='';render()}};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(selected&&!placed[selected.id]){placeAt(selected,d.x+61.5-selected.w/2,d.y+61.5-selected.h/2);selected=null}active=i;render()}};let m=document.createElement('div');m.className='mark';b.append(m);stage.append(b)});
Object.entries(placed).forEach(([id,pos])=>{let p=all.find(p=>p.id===id);let im=document.createElement('img');im.src=asset(p.file);im.className='piece';im.alt='動かせる部品';im.dataset.id=id;im.tabIndex=0;im.style.cssText=`left:${pos.x/14}%;top:${pos.y/7.5}%;width:${p.w/14}%;height:${p.h/7.5}%;${selected?.id===id?'filter:drop-shadow(0 0 3px #009dd2);':''}`;im.onpointerdown=e=>startDrag(e,p,true);im.onkeydown=e=>{let steps={ArrowLeft:[-3,0],ArrowRight:[3,0],ArrowUp:[0,-3],ArrowDown:[0,3]};if(steps[e.key]){e.preventDefault();let [dx,dy]=steps[e.key];placeAt(p,pos.x+dx,pos.y+dy);render();stage.querySelector('[data-id="'+id+'"]')?.focus()}else if(e.key==='Delete'||e.key==='Backspace'){delete placed[id];done[p.bi]=false;render()}};stage.append(im)});renderBank()}
function renderBank(){const bank=$('#pieces');bank.replaceChildren();$('#instruction').textContent=defs[active].q+'問目：部品を自由に動かして組み立てよう';let candidates=pool==='needed'?all.filter(p=>p.bi===active):all;const shuffled=[...candidates].sort((a,b)=>((a.bi*7+a.pi*11)%17)-((b.bi*7+b.pi*11)%17));shuffled.forEach(p=>{let tile=document.createElement('button');tile.className='tile'+(placed[p.id]?' used':'')+(selected?.id===p.id?' selected':'');tile.setAttribute('aria-label','部品 '+(shuffled.indexOf(p)+1));let im=document.createElement('img');im.src=asset(p.file);im.alt='';tile.append(im);tile.onpointerdown=e=>startDrag(e,p,false);tile.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=p;renderBank()}};bank.append(tile)});$('#check').disabled=done[active];$('#returnPiece').disabled=!selected||!placed[selected.id]}
function placeAt(p,x,y){placed[p.id]={x:Math.max(0,Math.min(1400-p.w,x)),y:Math.max(0,Math.min(750-p.h,y))};done[p.bi]=false;$('#finish').style.display='none';$('#message').textContent=''}
function startDrag(e,p,existing){e.preventDefault();e.stopPropagation();if(!existing&&placed[p.id])return;selected=p;let t=point(e),old=placed[p.id];drag={p,existing,sx:e.clientX,sy:e.clientY,moved:false,old:old?{...old}:null,ox:existing?t.x-old.x:p.w/2,oy:existing?t.y-old.y:p.h/2};if(existing){active=p.bi;renderBank()}else{renderBank();let im=document.createElement('img');im.id='ghost';im.src=asset(p.file);let r=stage.getBoundingClientRect();im.style.width=p.w*r.width/1400+'px';im.style.height=p.h*r.height/750+'px';document.body.append(im);moveGhost(e)}}
function moveGhost(e){let g=$('#ghost');if(g){g.style.left=e.clientX-parseFloat(g.style.width)/2+'px';g.style.top=e.clientY-parseFloat(g.style.height)/2+'px'}}
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>4)drag.moved=true;if(drag.existing&&drag.moved){let t=point(e);placeAt(drag.p,t.x-drag.ox,t.y-drag.oy);let im=stage.querySelector('[data-id="'+drag.p.id+'"]');im.style.left=placed[drag.p.id].x/14+'%';im.style.top=placed[drag.p.id].y/7.5+'%'}else moveGhost(e)},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;$('#ghost')?.remove();if(d.moved){let t=point(e);if(t.x>=0&&t.x<=1400&&t.y>=0&&t.y<=750){placeAt(d.p,t.x-d.ox,t.y-d.oy);let bi=defs.findIndex(b=>t.x>=b.x&&t.x<=b.x+123&&t.y>=b.y&&t.y<=b.y+123);if(bi>=0)active=bi}else if(d.existing){delete placed[d.p.id];done[d.p.bi]=false}selected=d.p;suppressClick=true;setTimeout(()=>suppressClick=false,0);render()}else{selected=d.p;renderBank()}});
document.addEventListener('pointercancel',()=>{if(!drag)return;if(drag.existing)placed[drag.p.id]=drag.old;drag=null;$('#ghost')?.remove();render()});
function isCorrect(bi){let d=defs[bi];return d.parts.every((p,pi)=>{let a=placed[bi+'-'+pi];return a&&Math.abs(a.x-(d.x+p[1]*123))<=19&&Math.abs(a.y-(d.y+p[2]*123))<=19})&&!all.some(p=>p.bi!==bi&&placed[p.id]&&placed[p.id].x+p.w/2>d.x&&placed[p.id].x+p.w/2<d.x+123&&placed[p.id].y+p.h/2>d.y&&placed[p.id].y+p.h/2<d.y+123)}
function sound(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C();[660,880].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.08,c.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.18+.25);o.start(c.currentTime+i*.18);o.stop(c.currentTime+i*.18+.26)});setTimeout(()=>c.close(),800)}catch{}}
$('#check').onclick=()=>{if(!isCorrect(active)){$('#message').textContent='部品の場所や組み合わせを、もういちど見てみよう。';return}done[active]=true;sound();selected=null;if(done.every(Boolean)){$('#finish').style.display='block';$('#message').textContent='';render()}else{active=done.findIndex(x=>!x);$('#message').textContent='できたね！ つぎの空欄を作ろう。';render()}};
$('#returnPiece').onclick=()=>{if(selected){delete placed[selected.id];done[selected.bi]=false;selected=null;$('#finish').style.display='none';render()}};
$('#reset').onclick=()=>{const d=defs[active];all.forEach(p=>{let a=placed[p.id];if(p.bi===active||(a&&a.x+p.w/2>d.x&&a.x+p.w/2<d.x+123&&a.y+p.h/2>d.y&&a.y+p.h/2<d.y+123)){delete placed[p.id];done[p.bi]=false}});done[active]=false;selected=null;$('#finish').style.display='none';$('#message').textContent='';render()};$('#start').onclick=begin;$('#back').onclick=()=>{$('#game').style.display='none';$('#setup').style.display='block';$('#back').hidden=true};
</script></html>
